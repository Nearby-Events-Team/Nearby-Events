# CI: every pull request and every push to main is type-checked, built and tested
# automatically, so a broken change shows a red ❌ on GitHub before anyone merges it.
#
# It needs no secrets and no Google Cloud access: the backend tests run against the local
# Firebase emulators (project "demo-nearby-events"), and nothing here deploys. Deploying to
# the live site stays a deliberate manual step (scripts/deploy.ps1).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund

      - name: Typecheck (backend + frontend)
        run: npm run typecheck

      - name: Production build (backend + frontend)
        run: npm run build

  backend-tests:
    name: Backend tests (Firestore + Auth emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix backend --no-audit --no-fund

      # Seeds the demo board, then runs the three suites: service checks, recommendation
      # scoring (intelligence) and trending (pulse). Any failed check fails the job.
      - name: Run tests against the emulators
        run: >
          npx firebase emulators:exec --only firestore,auth --project demo-nearby-events
          "npx tsx scripts/seed-events.ts --local &&
          cd backend &&
          npx tsx src/scripts/verify.ts &&
          npx tsx src/scripts/verify-intelligence.ts &&
          npx tsx src/scripts/verify-pulse.ts"
